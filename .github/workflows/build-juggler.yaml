name: build-juggler

on:
  push:
    branches: [main]
    paths:
      - 'apps/juggler/build/**'
      - '.github/workflows/build-juggler.yaml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/juggler/build
          push: true
          tags: |
            ghcr.io/tuckermclean/juggler:0.3.7
            ghcr.io/tuckermclean/juggler:latest
