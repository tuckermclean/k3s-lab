# No authentik forwardAuth here (unlike paperclip): Paseo has its own auth
# (PASEO_PASSWORD) and uses websockets / an E2E pairing flow that a forwardAuth
# redirect would break. TLS at the edge + Paseo's own password is the gate.
#
# NOTE: paseo.dcxxiv.com currently CNAMEs to oci.dcxxiv.com — it must be
# repointed to the ovh apex for this to serve (see the PR notes).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paseo
  namespace: paseo
  labels:
    app.kubernetes.io/part-of: gitops
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`paseo.dcxxiv.com`)
      services:
        - name: paseo
          port: 6767
  tls:
    secretName: paseo-tls
