apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcxxiv-home
  namespace: dcxxiv-home
  labels:
    app.kubernetes.io/name: dcxxiv-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dcxxiv-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcxxiv-home
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: dcxxiv-home-html
