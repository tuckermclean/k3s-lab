apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcxxiv-home
  namespace: dcxxiv-home
  labels:
    app.kubernetes.io/name: dcxxiv-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dcxxiv-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcxxiv-home
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: dcxxiv-home-html
