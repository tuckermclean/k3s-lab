apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcxxiv-home
  namespace: dcxxiv-home
  labels:
    app.kubernetes.io/name: dcxxiv-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dcxxiv-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcxxiv-home
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:1ed1b0e1d7652937d6cbdaf4018c7b6fc009a7dd6c3047351e2eddda745de43f
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: dcxxiv-home-html
