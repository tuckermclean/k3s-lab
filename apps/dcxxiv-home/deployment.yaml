apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcxxiv-home
  namespace: dcxxiv-home
  labels:
    app.kubernetes.io/name: dcxxiv-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dcxxiv-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcxxiv-home
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: dcxxiv-home-html
