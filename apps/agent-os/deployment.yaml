apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-os
  namespace: agent-os
  labels:
    app.kubernetes.io/name: agent-os
    app.kubernetes.io/part-of: gitops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-os
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: agent-os
          # Digest pinned after the first CI build publishes the image.
          image: ghcr.io/tuckermclean/agent-os:0.2.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3011
          env:
            - name: PORT
              value: "3011"
            - name: HOME
              value: /home/node
            # Nothing sets SHELL in a pod; agent-os falls back to /bin/zsh
            # (server.ts) which this image doesn't ship. Terminal sessions
            # exec this shell.
            - name: SHELL
              value: /bin/bash
            - name: DB_PATH
              value: /home/node/.agent-os/agent-os.db
            # In-pod Claude Code sessions dispatch subagents on Sonnet
            - name: CLAUDE_CODE_SUBAGENT_MODEL
              value: sonnet
            # Talk to the DinD sidecar (same pod netns) for the ISO
            # build+scan pipeline's `docker build`/buildx calls. Same
            # pattern as apps/juggler and apps/openhands.
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          # No envFrom/agent-os-env secret here: full-scope login mode
          # requires CLAUDE_CODE_OAUTH_TOKEN to be absent from the container
          # env (a long-lived setup-token overrides the interactive
          # full-scope login and breaks Remote Control). Run `claude-login`
          # (or `claude auth login`) once interactively; credentials persist
          # on the PVC. The agent-os-env secret's CLAUDE_CODE_OAUTH_TOKEN key
          # is now unused but left in place (see secret.sops.yaml).
          # Builds inside the workspace peg CPU/memory and slow the HTTP
          # server; probes must tolerate a busy-but-alive dev box or the
          # kubelet kills sessions mid-build (2026-07-06 incident).
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              # Observed 2.3Gi working set during builds; request must cover
              # it or the scheduler packs the pod onto memory-starved nodes.
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
        # ── Docker-in-Docker sidecar: gives the agent a real dockerd for the
        # ISO build+scan pipeline's `docker build`/buildx calls. Privileged
        # (dockerd needs it); reachable only within the pod netns at
        # tcp://localhost:2375 (TLS disabled). Same pattern as
        # apps/juggler and apps/openhands. dockerd needs root, so this
        # container overrides the pod-level runAsUser:1000/runAsGroup:1000
        # (juggler/openhands have no such pod-level override, so their dind
        # sidecars run as the image's default root user without needing one).
        - name: dind
          image: docker:29-dind@sha256:bfec1f5159c63a81ca6fdedbd81404d2c0e16378ed0feec3bb3fbf3998847659
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          env:
            # Empty cert dir => listen on tcp://0.0.0.0:2375 (plain), pod-local.
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            # dockerd's image/container store — ephemeral (throwaway ISO
            # build layers), kept off the Longhorn PVC to avoid
            # overlay-on-overlay.
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: agent-os-home
        - name: dind-storage
          emptyDir:
            sizeLimit: 20Gi
