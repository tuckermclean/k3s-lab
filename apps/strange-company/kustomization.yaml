apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # NOTE: the Vikunja `strange-company-bootstrap` service account (which the
  # control plane logs in as to mint its API token) is created out of band, NOT
  # by a manifest here. OIDC-only Vikunja can't self-provision it, and the
  # Vikunja image is distroless (no shell), so a `user create` Job can't be made
  # idempotent — on any re-run against an existing user it fails and wedges this
  # Kustomization's health gate. On a clean-slate rebuild, recreate it once with:
  #   PW=$(kubectl -n strange-company get secret strange-company-secrets \
  #        -o go-template='{{index .data "vikunja-bootstrap-password"}}' | base64 -d)
  #   kubectl -n strange-company exec deploy/strange-company-vikunja -- \
  #     /app/vikunja/vikunja user create -u strange-company-bootstrap \
  #     -e strange-company-bootstrap@dcxxiv.com -p "$PW"
  # Postgres credentials for the external CNPG `pg` cluster (SOPS-encrypted).
  # strange-company-db backs the control plane's DATABASE_USER/PASSWORD and the
  # chart's postgresql.external.existingSecret; vikunja-db backs Vikunja. Both
  # carry the same password as postgres/strange-company-role-secret.
  - db-secret.sops.yaml
  - vikunja-db-secret.sops.yaml
  # Authentik integration (SOPS-encrypted):
  #  - vikunja-oidc-config: config.yml (OIDC → Authentik) mounted into Vikunja
  #  - hermes-auth: ONLY the Hermes API key (envFrom). No basic-auth creds, so
  #    the dashboard is OIDC-only (see helmrelease hermes.env)
  - vikunja-oidc-config.sops.yaml
  - hermes-auth.sops.yaml
  # AI provider credentials. spec.valuesFrom injects these into the chart's
  # single-source `credentials` block (0.4.0 model): the chart creates +
  # projects deepseek-credentials/anthropic-oauth-credentials to the control
  # plane (/credentials) and pins them into Hermes (hermes.managed
  # .fromCredentials). Keys: deepseek-api-key, anthropic-oauth-token.
  - strange-company-provider-creds.sops.yaml
  # GitHub PAT as GITHUB_TOKEN, envFrom'd into the control plane via
  # controlPlane.existingSecret — the chart won't emit its own github-token key
  # when hermes uses an existingSecret (that key is gated behind $needApiKey).
  - strange-company-github-env.sops.yaml
  # Git credential the coding Jobs push their agent branch with. Same classic
  # PAT as github-env — repo/contents:write but NO workflow scope, so the coding
  # agent can't rewrite the CI that judges it (§6). key: token. As of chart
  # 0.8.1 this Secret is the valuesFrom SOURCE injected into the chart's
  # `credentials` block as `agent-git` (see helmrelease), which the chart then
  # renders into the agent-runs namespace where the Jobs read it — a bare
  # gitCredential Secret would stay in the release ns and never reach the Jobs.
  - sc-agent-git.sops.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: gitops
