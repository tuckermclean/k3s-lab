apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # Postgres credentials for the external CNPG `pg` cluster (SOPS-encrypted).
  # strange-company-db backs the control plane's DATABASE_USER/PASSWORD and the
  # chart's postgresql.external.existingSecret; vikunja-db backs Vikunja. Both
  # carry the same password as postgres/strange-company-role-secret.
  - db-secret.sops.yaml
  - vikunja-db-secret.sops.yaml
  # Authentik integration (SOPS-encrypted):
  #  - vikunja-oidc-config: config.yml (OIDC → Authentik) mounted into Vikunja
  #  - hermes-auth: ONLY the Hermes API key (envFrom). No basic-auth creds, so
  #    the dashboard is OIDC-only (see helmrelease hermes.env)
  - vikunja-oidc-config.sops.yaml
  - hermes-auth.sops.yaml
  # AI provider credentials (SOPS-encrypted), consumed by the control plane's
  # policy (providers.yaml → secret name/key) and by Hermes' managed scope:
  #  - deepseek-credentials: DeepSeek api-key (foreman + coding ladder)
  #  - anthropic-oauth-credentials: Claude subscription OAuth token (spec convo)
  #  - strange-company-hermes-managed: .env pinning both of the above into
  #    Hermes' dashboard-immutable managed scope (helmrelease hermes.managed)
  - deepseek-credentials.sops.yaml
  - anthropic-oauth-credentials.sops.yaml
  - strange-company-hermes-managed.sops.yaml
  # GitHub PAT for issue ingestion (0.4.0 work intake). Injected into the
  # HelmRelease at github.token via spec.valuesFrom (targetPath).
  - strange-company-github.sops.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: gitops
