apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # Postgres credentials for the external CNPG `pg` cluster (SOPS-encrypted).
  # strange-company-db backs the control plane's DATABASE_USER/PASSWORD and the
  # chart's postgresql.external.existingSecret; vikunja-db backs Vikunja. Both
  # carry the same password as postgres/strange-company-role-secret.
  - db-secret.sops.yaml
  - vikunja-db-secret.sops.yaml
  # Authentik integration (SOPS-encrypted):
  #  - vikunja-oidc-config: config.yml (OIDC → Authentik) mounted into Vikunja
  #  - hermes-auth: dashboard basic-auth + API key (envFrom into Hermes)
  #  - hermes-basicauth: Traefik Middleware injecting that basic-auth downstream,
  #    chained after the authentik forwardAuth middleware on the Hermes Ingress
  - vikunja-oidc-config.sops.yaml
  - hermes-auth.sops.yaml
  - hermes-basicauth.sops.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: gitops
