apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # Postgres credentials for the external CNPG `pg` cluster (SOPS-encrypted).
  # strange-company-db backs the control plane's DATABASE_USER/PASSWORD and the
  # chart's postgresql.external.existingSecret; vikunja-db backs Vikunja. Both
  # carry the same password as postgres/strange-company-role-secret.
  - db-secret.sops.yaml
  - vikunja-db-secret.sops.yaml
  # Authentik integration (SOPS-encrypted):
  #  - vikunja-oidc-config: config.yml (OIDC → Authentik) mounted into Vikunja
  #  - hermes-auth: ONLY the Hermes API key (envFrom). No basic-auth creds, so
  #    the dashboard is OIDC-only (see helmrelease hermes.env)
  - vikunja-oidc-config.sops.yaml
  - hermes-auth.sops.yaml
  # AI provider credentials. spec.valuesFrom injects these into the chart's
  # single-source `credentials` block (0.4.0 model): the chart creates +
  # projects deepseek-credentials/anthropic-oauth-credentials to the control
  # plane (/credentials) and pins them into Hermes (hermes.managed
  # .fromCredentials). Keys: deepseek-api-key, anthropic-oauth-token.
  - strange-company-provider-creds.sops.yaml
  # GitHub PAT as GITHUB_TOKEN, envFrom'd into the control plane via
  # controlPlane.existingSecret — the chart won't emit its own github-token key
  # when hermes uses an existingSecret (that key is gated behind $needApiKey).
  - strange-company-github-env.sops.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: gitops
