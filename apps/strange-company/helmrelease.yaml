apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strange-company
  namespace: strange-company
  labels:
    app.kubernetes.io/part-of: gitops
spec:
  interval: 5m
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  # Hermes' image is ~900MB across 38 layers; the first pull is slow.
  timeout: 20m
  chart:
    spec:
      chart: strange-company
      version: "0.13.0"
      sourceRef:
        kind: HelmRepository
        name: tuckermclean-charts
        namespace: flux-system
  # All provider credentials come from ONE SOPS Secret, injected via targetPath
  # so no token ever lives in plaintext git. They land in the chart's
  # single-source `credentials` block — 0.4.0 projects those to the control
  # plane as files at /credentials/<secret>/<key> AND (via hermes.managed
  # .fromCredentials below) pins them into Hermes — plus github.token.
  valuesFrom:
    - kind: Secret
      name: strange-company-provider-creds
      valuesKey: deepseek-api-key
      targetPath: credentials.deepseek-credentials.api-key
    - kind: Secret
      name: strange-company-provider-creds
      valuesKey: anthropic-oauth-token
      targetPath: credentials.anthropic-oauth-credentials.oauth-token
    # The coding Jobs run in their OWN namespace (agentRuns.namespace), and a
    # Job's secretKeyRef resolves in the pod's namespace — not the release's. As
    # of 0.8.1 the chart renders every `credentials` entry into agent-runs too,
    # so the git push credential must live in this block to reach the Jobs (a
    # bare gitCredential-only Secret stays in the release ns and 404s the Job
    # with CreateContainerConfigError). We feed it from the existing
    # `sc-agent-git` SOPS Secret (contents:write, NOT workflows:write) under the
    # credential name `agent-git`; gitCredential.secret points at that.
    - kind: Secret
      name: sc-agent-git
      valuesKey: token
      targetPath: credentials.agent-git.token
  values:
    # ── PostgreSQL: use the cluster's shared CloudNativePG `pg` cluster, not a
    # chart-owned StatefulSet. The `strange-company` role and the
    # `strange-company` + `vikunja` databases are provisioned on `pg` (see
    # infrastructure/database/postgres/cluster.yaml). Credentials come from the
    # `strange-company-db` Secret (created out-of-band, SOPS).
    postgresql:
      enabled: false
      external:
        host: pg-rw.postgres.svc.cluster.local
        port: 5432
        database: strange-company
        existingSecret: strange-company-db
        usernameKey: username
        passwordKey: password
    # ── Vikunja (Kanban) at kanban.dcxxiv.com. `vikunja.*` keys below the
    # doubled `vikunja.vikunja` are THIS chart's; `vikunja.vikunja.*` passes to
    # the upstream Vikunja subchart. With external Postgres we point Vikunja's DB
    # env at `pg-rw` and supply the password via the `vikunja-db` Secret
    # (SOPS, out-of-band). databaseSecretName MUST match the secretKeyRef name.
    vikunja:
      # Share the control-plane's Kanban board with the human operator's Vikunja
      # username so cards are visible after OIDC login (Vikunja shareWith takes
      # usernames, not "all authenticated"). permission 1 = read & write, since
      # a human moving a card is a real signal the control plane reconciles back.
      board:
        shareWith:
          - akadmin
        permission: 1
        # Apply this Vikunja label to a card to approve its specification
        # (0.6.0, spec 10.2). The control plane applies the approval and then
        # removes the label, so it never approves a later unconsented edit.
        approvalLabel: spec-approved
      databaseSecretName: vikunja-db
      vikunja:
        env:
          VIKUNJA_DATABASE_TYPE: postgres
          VIKUNJA_DATABASE_HOST: 'pg-rw.postgres.svc.cluster.local:5432'
          VIKUNJA_DATABASE_USER: strange-company
          VIKUNJA_DATABASE_DATABASE: vikunja
          VIKUNJA_DATABASE_SSLMODE: disable
          VIKUNJA_DATABASE_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: vikunja-db
                key: password
          VIKUNJA_SERVICE_PUBLICURL: 'https://kanban.dcxxiv.com'
        # OIDC config carries the client secret, so it must NOT be a plaintext
        # ConfigMap — disable the chart's config ConfigMap and mount config.yml
        # from a SOPS secret instead (mountPath/subPath inherited from the
        # subchart's hardcoded persistence.config).
        configMaps:
          config:
            enabled: false
        persistence:
          config:
            type: secret
            name: strange-company-vikunja-oidc
        ingress:
          main:
            enabled: true
            # The upstream Vikunja subchart does not map `className` to
            # ingressClassName, so we select Traefik the way the rest of this
            # repo does — via the legacy ingress.class annotation.
            annotations:
              kubernetes.io/ingress.class: traefik
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - host: kanban.dcxxiv.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - hosts: [kanban.dcxxiv.com]
                secretName: kanban-tls
    # ── Hermes dashboard at hermes.dcxxiv.com (port 9119). Gateway (8642) stays
    # ClusterIP. Sign-in is OIDC-only (see env below).
    hermes:
      # OIDC-ONLY: the existingSecret intentionally carries ONLY HERMES_API_KEY
      # (no HERMES_DASHBOARD_BASIC_AUTH_*), so the 'basic' username/password
      # provider does not register — the dashboard offers only "Self-Hosted
      # OIDC". This removes the basic form (nothing for a browser to autofill)
      # and the stale-basic-session 503 (basic's HMAC session key rotates every
      # restart). The dashboard still binds: OIDC is a valid auth provider.
      # apiKeyKey is a valid env-var name, read by Hermes (API_SERVER_KEY) and
      # the control plane (HERMES_API_KEY).
      existingSecret: strange-company-hermes-auth
      apiKeyKey: HERMES_API_KEY
      # Managed scope: an IT-pushed, dashboard-immutable layer that pins the
      # provider credentials Hermes uses for the foreman (DeepSeek) and the
      # specification conversation (Claude OAuth). The referenced Secret holds a
      # `.env` and is created out-of-band (SOPS / kubectl), never by the chart.
      managed:
        # Pin the SAME provider credentials into Hermes' dashboard-immutable
        # managed scope, resolved from the `credentials` block above — one
        # source of truth, so the gateway and the control plane can't drift.
        enabled: true
        fromCredentials:
          DEEPSEEK_API_KEY: deepseek-credentials.api-key
          CLAUDE_CODE_OAUTH_TOKEN: anthropic-oauth-credentials.oauth-token
      # Hermes is cgroup-aware: with NO memory limit it reads the (shared,
      # ~83%-full) host and its dashboard warns "agent running low on memory"
      # + throttles workers. A limit gives it a real budget to size against.
      # A request also lifts it out of BestEffort so node memory pressure
      # doesn't evict/OOM-kill it first (it had been SIGKILLed before).
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 3Gi
      env:
        # Native OIDC SSO against Authentik — a PUBLIC PKCE client (no secret).
        # The dashboard discovers endpoints from
        # {issuer}/.well-known/openid-configuration and calls back to
        # https://hermes.dcxxiv.com/auth/callback. The matching Authentik OIDC
        # provider is in bootstrap/terraform/authentik/hermes.tf. This replaces
        # the old Traefik forward-auth gate (no middleware annotation now).
        HERMES_DASHBOARD_OIDC_ISSUER: https://auth.dcxxiv.com/application/o/hermes/
        HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes-dashboard
        # Required: behind Traefik (TLS-terminating) the dashboard otherwise
        # builds an http:// OIDC callback, which Authentik rejects as an invalid
        # redirect_uri → "auth provider unreachable" (503). This pins the public
        # HTTPS origin so the callback is https://hermes.dcxxiv.com/auth/callback.
        HERMES_DASHBOARD_PUBLIC_URL: https://hermes.dcxxiv.com
      ingress:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        host: hermes.dcxxiv.com
        tls:
          - hosts: [hermes.dcxxiv.com]
            secretName: hermes-tls
    # Control plane is chart-owned. As of chart 0.2.0 its image tag defaults to
    # .Chart.appVersion, so we set no image override and no external version pin
    # here — only the explicit `enabled: true`. (An empty map `{}` is stored as
    # null in the HelmRelease .spec.values, which nulls the chart's controlPlane
    # defaults and breaks `.Values.controlPlane.enabled` at render time.)
    controlPlane:
      enabled: true
      # Autonomy posture (0.13.0). auto-approve-specs = the control plane signs
      # any specification that would pass the gate if a human signed it, so the
      # loop no longer needs a manual approve-spec per card. It bypasses NOTHING
      # else: an incomplete spec, an unverifiable acceptance criterion, or a
      # missing permitted-actions allowlist still stops the card, and the audit
      # records the approver as the setting rather than a person. The human
      # remains the sole final MERGE authority (spec §19) — nothing here can
      # approve a merge.
      autonomy: auto-approve-specs
      # GITHUB_TOKEN for issue ingestion via envFrom. The chart gates its own
      # `github-token` secret key behind $needApiKey, which is FALSE for us
      # because hermes uses an existingSecret — so the chart never emits the
      # token. Supply it here instead, from a SOPS Secret holding GITHUB_TOKEN.
      existingSecret: strange-company-github-env
      # Run coding executions as isolated Kubernetes Jobs in their own
      # namespace (spec §16), created by this release. RBAC (a namespaced Role
      # to create Jobs + read pod logs) is rendered by the chart.
      agentRuns:
        enabled: true
        namespace: agent-runs
        createNamespace: true
      # Git credential the coding Jobs push their agent branch with — a
      # SEPARATE, scoped token (contents:write, NOT workflows:write) so an
      # agent can't rewrite the CI that judges it. Deliberately NOT the
      # operator's github token. This is the `agent-git` credential injected via
      # valuesFrom above (sourced from the sc-agent-git SOPS Secret), so 0.8.1
      # renders it into the agent-runs namespace where the Jobs actually read it.
      gitCredential:
        secret: agent-git
        key: token
      # Red/green gates read the repository's own GitHub Actions checks
      # (default). sandbox-derp's workflow must trigger on `agent/**` or the
      # agent branch produces no checks, which the control plane refuses rather
      # than reading as a pass.
      verification:
        mode: github-actions
    # ── Model & provider policy, overriding the control plane's built-in
    # defaults. The coding ladder runs entirely on DeepSeek (cheap v4-flash →
    # less-cheap v4-pro) through the Hermes harness; the specification
    # conversation runs on Claude via subscription OAuth. No metered Anthropic
    # API key is used. providers.yaml/models.yaml schema:
    # control-plane/internal/policy/defaults/ in the strange-company repo.
    policy:
      providers: |
        providers:
          deepseek:
            harness: hermes
            baseUrl: https://api.deepseek.com
            env:
              DEEPSEEK_API_KEY:
                secret: deepseek-credentials
                key: api-key
          # Same DeepSeek endpoint, the opencode CODING harness (0.7.0 runner
          # ships opencode). Used by the implementation + tests rungs; foreman/
          # plan/review stay on `deepseek` (hermes) chat completions. Two
          # providers over one endpoint = the providers.yaml naming convention:
          # same vendor, distinguished by harness. Key arrives via the injected
          # env (never argv); permissions come from the runner's opencode.json.
          deepseek-coding:
            harness: opencode
            baseUrl: https://api.deepseek.com
            env:
              DEEPSEEK_API_KEY:
                secret: deepseek-credentials
                key: api-key
          anthropic-oauth:
            harness: claude-code
            env:
              CLAUDE_CODE_OAUTH_TOKEN:
                secret: anthropic-oauth-credentials
                key: oauth-token
      models: |
        aliases:
          foreman-cheap:
            provider: deepseek
            model: deepseek-v4-flash
          spec-frontier:
            provider: anthropic-oauth
            model: claude-fable-5
          plan:
            provider: deepseek
            model: deepseek-v4-pro
          tests:
            provider: deepseek-coding
            model: deepseek-v4-pro
          implement-cheap:
            provider: deepseek-coding
            model: deepseek-v4-flash
          implement-mid:
            provider: deepseek-coding
            model: deepseek-v4-pro
          implement-frontier:
            provider: deepseek-coding
            model: deepseek-v4-pro
          review:
            provider: deepseek
            model: deepseek-v4-pro
        phases:
          foreman:
            - model: foreman-cheap
              max_attempts: 1
          specification:
            - model: spec-frontier
              max_attempts: 1
          planning:
            - model: plan
              max_attempts: 1
          tests:
            - model: tests
              max_attempts: 2
          implementation:
            - model: implement-cheap
              max_attempts: 3
            - model: implement-mid
              max_attempts: 3
            - model: implement-frontier
              max_attempts: 1
          review:
            - model: review
              max_attempts: 1
    # ── Work intake (0.4.0): GitHub issues labeled `agent-ready` in these repos
    # become board cards → foreman screening → spec → DeepSeek coding ladder.
    # The token arrives via controlPlane.existingSecret (GITHUB_TOKEN), not here.
    github:
      repositories:
        - tuckermclean/sandbox-derp
