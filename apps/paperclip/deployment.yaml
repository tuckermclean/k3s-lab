apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/part-of: gitops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperclip
  template:
    metadata:
      labels:
        app: paperclip
    spec:
      serviceAccountName: paperclip
      initContainers:
        # GitOps-materialize the obra/superpowers skills onto the PVC so they can
        # be imported into Paperclip via a local_path source. Paperclip refuses
        # *external* GitHub skill sources that bundle executable scripts (which
        # superpowers does); a local path is operator-trusted and bypasses that.
        # Pinned to a commit for reproducibility; the SHA-named marker makes this
        # a no-op on ordinary restarts and re-clones only on a SHA bump or a fresh
        # volume. Reuses the data PVC — deliberately no extra Longhorn volume.
        - name: clone-superpowers
          image: alpine/git:2.47.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SHA=b36e0829c6d0140e93cfef2ca599b1b07d4a7797
              DEST=/paperclip/skills-src/superpowers
              MARK="$DEST/.pinned-$SHA"
              if [ -f "$MARK" ]; then echo "superpowers already at $SHA"; exit 0; fi
              rm -rf "$DEST"
              mkdir -p "$(dirname "$DEST")"
              git clone --no-checkout https://github.com/obra/superpowers "$DEST"
              git -C "$DEST" checkout "$SHA"
              touch "$MARK"
              echo "cloned superpowers @ $SHA"
          volumeMounts:
            - name: data
              mountPath: /paperclip
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: paperclip
          # Self-hosted Paperclip publishes a floating `latest` (the version-
          # pinned tags are `-cloud`, for the hosted service). Pin the immutable
          # per-commit `sha-<short>` tag instead: it's never overwritten and stays
          # tagged (so it isn't GC'd like an untagged digest would be). This one is
          # release v2026.831.1 (commit 65ec059) — currently identical to `latest`.
          # To upgrade: pick a newer sha- tag and bump this line deliberately.
          image: ghcr.io/paperclipai/paperclip:sha-65ec059
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3100
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3100"
            - name: SERVE_UI
              value: "true"
            - name: PAPERCLIP_HOME
              value: /paperclip
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: authenticated
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: private
            - name: PAPERCLIP_PUBLIC_URL
              value: https://paperclip.dcxxiv.com
            - name: PAPERCLIP_AUTH_PUBLIC_BASE_URL
              value: https://paperclip.dcxxiv.com
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: paperclip.dcxxiv.com
            # The API/auth public URL is the Authentik-gated ingress, so anything
            # that calls the Paperclip API via the public URL bounces off the
            # login. Pin the API base agents/tools use to loopback — the only host
            # exempt from the ALLOWED_HOSTNAMES guard (the in-cluster Service DNS
            # is rejected too). An explicit PAPERCLIP_API_URL wins over the
            # derived value. NB: this is correct for the in-pod (native) runtime;
            # when the k8s sandbox job backend runs agents in separate pods,
            # they'll need the Service DNS added to ALLOWED_HOSTNAMES + a callback
            # URL, since loopback won't reach the server from another pod.
            - name: PAPERCLIP_API_URL
              value: http://localhost:3100
          envFrom:
            - secretRef:
                name: paperclip-secrets
          volumeMounts:
            - name: data
              mountPath: /paperclip
          startupProbe:
            tcpSocket:
              port: 3100
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 3100
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3100
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperclip-data
