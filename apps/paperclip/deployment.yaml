apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/part-of: gitops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperclip
  template:
    metadata:
      labels:
        app: paperclip
    spec:
      serviceAccountName: paperclip
      # GitOps hotfix for an upstream bug in @paperclipai/plugin-kubernetes
      # v2026.916.0: the top-level lease metadata field `remoteCwd` is read by
      # BOTH sides of the sandbox-cr flow — the plugin's file-sync confinement
      # (resolveSyncRemoteDir) AND the server (heartbeat.ts builds the remote
      # execution target's remoteCwd from lease.metadata.remoteCwd) — but the
      # plugin's lease builders (acquireLease / resume) never write it. Realize
      # only records remoteCwd nested under `workspaceRealization`. With it
      # unset, each side defaults differently: the server falls back to /tmp
      # while the workspace lives at /workspace, so file-sync fails with either
      # "requires a workspace remote dir on the lease metadata" or "sync target
      # path escapes the workspace remote dir: /tmp/.paperclip-runtime/...".
      # This initContainer patches the plugin on the shared PVC to (1) write a
      # top-level remoteCwd onto both leaseMetadata objects and (2) make the
      # reader fall back to the nested value / the always-present /workspace
      # emptyDir mount. Both sides then agree on /workspace.
      #
      # (3) A second, related sandbox bug: the pod runs as UID 1000 but the
      # /workspace emptyDir mount is owned by root (fsGroup only sets the group),
      # so git's ownership guard rejects the post-run outbound git-sync with
      # "fatal: detected dubious ownership in repository at '/workspace'" (exit
      # 128 → adapter_failed → agent stuck in `error`). The sync runs git with
      # GIT_CONFIG_GLOBAL=/dev/null, so a ~/.gitconfig safe.directory is ignored;
      # the only channel is GIT_CONFIG_* env. We inject safe.directory=* into
      # every sandbox pod's container env via pod-spec-builder (verified: git
      # 2.34.1 honors it from GIT_CONFIG_COUNT/KEY/VALUE even with GLOBAL nulled).
      # Idempotent; re-runs and unknown plugin versions are no-ops.
      # Remove once upstream ships a fix: paperclipai/paperclip#13587.
      initContainers:
        - name: patch-k8s-plugin
          image: ghcr.io/paperclipai/paperclip:sha-6de50ba
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              D=/paperclip/.paperclip/plugins/node_modules/@paperclipai/plugin-kubernetes/dist
              F="$D/plugin.js"
              PSB="$D/pod-spec-builder.js"
              if [ ! -f "$F" ]; then
                echo "[patch] plugin not installed on PVC yet; skipping (applies on next restart after install)"; exit 0
              fi
              changed=0
              # (1) Reader: fall back to the nested value, then the /workspace mount.
              if grep -qF 'const remoteCwd = lease.metadata?.remoteCwd;' "$F"; then
                sed -i 's#const remoteCwd = lease.metadata?.remoteCwd;#const remoteCwd = lease.metadata?.remoteCwd ?? lease.metadata?.workspaceRealization?.remotePath ?? "/workspace";#' "$F"
                changed=1
              fi
              # (2) Writer: put a top-level remoteCwd on both leaseMetadata objects so
              # the server (heartbeat) and the plugin resolve the same /workspace root.
              if grep -qF 'const leaseMetadata = {' "$F" && ! grep -qF 'const leaseMetadata = { remoteCwd:' "$F"; then
                sed -i 's#const leaseMetadata = {#const leaseMetadata = { remoteCwd: "/workspace",#g' "$F"
                changed=1
              fi
              # (3) Inject into every sandbox pod's container env: (a) safe.directory=*
              # so git trusts the root-owned /workspace mount (fixes dubious-ownership),
              # and (b) a github.com credential helper that feeds the run's GH_TOKEN to
              # git as x-access-token. The sandbox agent's own `git push` otherwise has
              # NO credential source: the managed broker is a managed-cloud feature that
              # is absent/unwired in self-hosted, and the company-secret path only covers
              # server-side clone. Upstream #13588 stopped the managed launcher from
              # clobbering injected git config, which lets this helper survive. Least-
              # privilege holds: only agents whose env carries GH_TOKEN (the Release
              # Engineer) can push. BOTH builders carry the same env (job + sandbox-cr).
              FULL='env: [{ name: "HOME", value: "/home/paperclip" }, { name: "GIT_CONFIG_COUNT", value: "2" }, { name: "GIT_CONFIG_KEY_0", value: "safe.directory" }, { name: "GIT_CONFIG_VALUE_0", value: "*" }, { name: "GIT_CONFIG_KEY_1", value: "credential.https://github.com.helper" }, { name: "GIT_CONFIG_VALUE_1", value: "!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f" }],'
              for B in "$PSB" "$D/sandbox-cr-builder.js"; do
                [ -f "$B" ] || continue
                grep -qF 'GIT_CONFIG_KEY_1' "$B" && continue
                # handle a fresh (HOME-only) file OR a previously safe.directory-only one
                sed -i 's#env: \[{ name: "HOME", value: "/home/paperclip" }\],#'"$FULL"'#' "$B"
                sed -i 's#env: \[{ name: "HOME", value: "/home/paperclip" }, { name: "GIT_CONFIG_COUNT", value: "1" }, { name: "GIT_CONFIG_KEY_0", value: "safe.directory" }, { name: "GIT_CONFIG_VALUE_0", value: "\*" }\],#'"$FULL"'#' "$B"
                grep -qF 'GIT_CONFIG_KEY_1' "$B" && changed=1
              done
              # (4) Host-mode GitHub push credential (the ACTUAL fix for agent push).
              # Self-hosted has no managed GitHub connection, so heartbeat resolves
              # `useHostGitHub = !githubConfigured && trust=standard && driver=local`
              # → TRUE for our agents. In host mode the broker launcher is NOT
              # installed and prepareGitHubExecutionEnvironment leaves GIT_CONFIG_GLOBAL
              # unset, so the agent's own `git push` reads $HOME/.gitconfig. The native
              # runner passes HOME through (NATIVE_PROVIDER_HOST_ENV_KEYS), so the
              # agent's HOME is this server HOME = /paperclip. We install a github.com
              # credential helper here that answers with the run's GH_TOKEN as
              # x-access-token. Only the Release Engineer's run carries GH_TOKEN in its
              # env (adapter_config secret_ref), so ONLY it can authenticate a push —
              # every other agent's helper emits an empty password and fails closed.
              # This is the supported host auth mode, not a bypass; the broker path is
              # connection-only and structurally cannot use company secrets. The server's
              # own managed clone overrides this via `-c` flags, so no interference.
              GC=/paperclip/.gitconfig
              if ! grep -qF 'x-access-token' "$GC" 2>/dev/null; then
                cat >> "$GC" <<'GITCFG'
              [credential]
              helper =
              [credential "https://github.com"]
              helper = "!f() { test \"$1\" = get && echo username=x-access-token && echo \"password=$GH_TOKEN\"; }; f"
              [credential "https://www.github.com"]
              helper = "!f() { test \"$1\" = get && echo username=x-access-token && echo \"password=$GH_TOKEN\"; }; f"
              GITCFG
                echo "[patch] installed host-mode github credential helper in .gitconfig"
                changed=1
              fi
              if [ "$changed" = 1 ]; then
                echo "[patch] applied remoteCwd + safe.directory + github-credential + host-gitconfig patches"
              else
                echo "[patch] nothing to do (already patched or plugin version changed)"
              fi
          volumeMounts:
            - name: data
              mountPath: /paperclip
      containers:
        - name: paperclip
          # Self-hosted Paperclip publishes a floating `latest` (the version-
          # pinned tags are `-cloud`, for the hosted service). Pin the immutable
          # per-commit `sha-<short>` tag instead: it's never overwritten and stays
          # tagged (so it isn't GC'd like an untagged digest would be).
          # This is a MASTER (dev) build (commit 6de50ba), NOT a formal release —
          # taken deliberately because it carries #13588 "repair managed Git
          # launchers in sandbox projects" (stops empty managed-identity vars from
          # clobbering valid git config, which was blocking agent GitHub push) plus
          # #13515 stranded-sandbox-lease recovery, neither of which is in any
          # tagged release yet (v2026.916.1 is only v2026.916.0 + a chat fix).
          # NB: runs migrations 0280-0283 on boot; effectively one-way (rolling back
          # to sha-dffc2b3 after they apply is unsafe). The k8s plugin is unchanged
          # from 916.0, so the initContainer patches above still apply.
          # To upgrade: pick a newer sha- tag and bump this line (and the initContainer
          # image below) deliberately.
          image: ghcr.io/paperclipai/paperclip:sha-6de50ba
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3100
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3100"
            - name: SERVE_UI
              value: "true"
            - name: PAPERCLIP_HOME
              value: /paperclip
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: authenticated
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: private
            - name: PAPERCLIP_PUBLIC_URL
              value: https://paperclip.dcxxiv.com
            - name: PAPERCLIP_AUTH_PUBLIC_BASE_URL
              value: https://paperclip.dcxxiv.com
            # Allow both the public host (for the browser via Authentik) and the
            # in-cluster Service DNS. The Service DNS is what agents use as the API
            # base (below); without it here the ALLOWED_HOSTNAMES guard 403s them.
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: paperclip.dcxxiv.com,paperclip.paperclip.svc.cluster.local
            # The API/auth public URL is the Authentik-gated ingress, so anything
            # calling the API via it bounces off the login. Point the API base
            # agents/tools use at the in-cluster Service DNS instead: it reaches
            # the ClusterIP (never Authentik) and works for BOTH the in-pod native
            # runtime AND the k8s sandbox job backend (separate Job pods, where
            # loopback would resolve to themselves). An explicit PAPERCLIP_API_URL
            # wins over the derived value.
            - name: PAPERCLIP_API_URL
              value: http://paperclip.paperclip.svc.cluster.local:3100
          envFrom:
            - secretRef:
                name: paperclip-secrets
          volumeMounts:
            - name: data
              mountPath: /paperclip
          startupProbe:
            tcpSocket:
              port: 3100
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 3100
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3100
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Interim headroom while agents still run in-pod (native runtime).
              # 6 agents pegged the old 2Gi ceiling → OOM. Once agents run as k8s
              # Jobs (separate pods), the server alone fits well under 2Gi again.
              memory: 4Gi
        # GitHub App token rotator (sidecar). Mints an installation-wide token
        # (every repo the app in apps/paperclip/github-app.sops.yaml is installed
        # on) and rotates it into the GITHUB_TOKEN company secret so the Release
        # Engineer acts as the app bot (distinct from the human → required-review
        # merge gate). One rotator for all repos, not one per repo. Lives here (not
        # a standalone Deployment) because the secrets master key is on this pod's
        # RWO PVC. Runs as uid 1000 (owns master.key).
        # Script + rationale: apps/paperclip/gh-app-rotator.yaml.
        - name: gh-app-token-rotator
          image: ghcr.io/paperclipai/paperclip:sha-6de50ba
          imagePullPolicy: IfNotPresent
          command: ["node", "/scripts/rotate.js"]
          env:
            - name: PAPERCLIP_COMPANY_ID
              value: "5e92e86b-c307-4ed9-a6ee-a9c940e35147"
            - name: PAPERCLIP_GITHUB_SECRET_KEY
              value: "GITHUB_TOKEN"
            - name: ROTATE_INTERVAL_SEC
              value: "1800"
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: DATABASE_URL
          # GITHUB_APP_ID + GITHUB_APP_PRIVATE_KEY + GITHUB_APP_INSTALLATION_ID
          # (repo-agnostic: the app installation spans every repo it's added to)
          envFrom:
            - secretRef:
                name: paperclip-github-app
          volumeMounts:
            - name: data
              mountPath: /paperclip
              readOnly: true
            - name: gh-app-rotator-script
              mountPath: /scripts
              readOnly: true
            - name: gh-app-rotator-tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperclip-data
        - name: gh-app-rotator-script
          configMap:
            name: paperclip-gh-app-rotator-script
        - name: gh-app-rotator-tmp
          emptyDir: {}
