# Web UI gated by the shared authentik forwardAuth middleware (embedded outpost),
# same pattern as agent.dcxxiv.com / orch.dcxxiv.com. Paperclip itself runs in
# deploymentExposure=private, treating this proxy as the trusted front.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/part-of: gitops
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`paperclip.dcxxiv.com`)
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: paperclip
          port: 3100
  tls:
    secretName: paperclip-tls
