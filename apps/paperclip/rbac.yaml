apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/part-of: gitops
---
# Cluster-scoped RBAC for the Paperclip agent-sandbox plugin (job backend). The
# plugin provisions an isolated tenant namespace per company on first dispatch —
# namespace + ServiceAccount + Role/RoleBinding (tenant pods get only pods/log) +
# ResourceQuota + LimitRange + deny-all/egress NetworkPolicies — then runs each
# agent as a batch/v1 Job and streams its pod logs. These verbs are the minimal
# set those operations require. (The sandbox-cr backend will later add
# sandboxes.agents.x-k8s.io + pods/exec; deliberately not included here.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paperclip-sandbox
  labels:
    app.kubernetes.io/part-of: gitops
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas, limitranges, secrets]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paperclip-sandbox
  labels:
    app.kubernetes.io/part-of: gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: paperclip-sandbox
subjects:
  - kind: ServiceAccount
    name: paperclip
    namespace: paperclip
