# GitHub App token rotator — sidecar for the Paperclip pod.
#
# Makes the Release Engineer act as the GitHub App bot (a distinct identity from
# the human operator) so a required-review branch protection can gate merges: the
# bot opens PRs it cannot approve, the human approves + merges.
#
# Every ROTATE_INTERVAL_SEC it: signs a GitHub App JWT with the app private key,
# mints a short-lived, INSTALLATION-WIDE token (covers every repo the app is
# installed on, with the app's own permissions), AES-256-GCM-encrypts it with
# Paperclip's own master key, and writes a new `current` version of the
# GITHUB_TOKEN company secret — replicating svc.rotate() exactly (disabled insert,
# latest_version bump, demote others to previous, promote the new one to current).
# Repo-agnostic on purpose: one rotator for ALL repos (current and future). Adding
# a repo is just installing the app on it in GitHub — nothing changes here.
#
# Safety: on startup it self-tests by DECRYPTING the current secret version with
# the master key; if that fails it exits (crashloops) WITHOUT ever writing, so a
# wrong key or format mismatch can never corrupt the live credential. Runs in the
# Paperclip pod because the master key lives on that pod's RWO PVC.
# Remove once upstream ships a first-class GitHub App credential for agents.
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-gh-app-rotator-script
  namespace: paperclip
  labels:
    app.kubernetes.io/part-of: gitops
data:
  rotate.js: |
    'use strict';
    const fs = require('fs');
    const crypto = require('crypto');

    const APP_ID = (process.env.GITHUB_APP_ID || '').trim();
    const PRIVATE_KEY = process.env.GITHUB_APP_PRIVATE_KEY || '';
    const INSTALLATION_ID = (process.env.GITHUB_APP_INSTALLATION_ID || '').trim();
    const COMPANY_ID = process.env.PAPERCLIP_COMPANY_ID;
    const SECRET_KEY = process.env.PAPERCLIP_GITHUB_SECRET_KEY || 'GITHUB_TOKEN';
    const MASTER_KEY_FILE = process.env.PAPERCLIP_SECRETS_MASTER_KEY_FILE
      || '/paperclip/instances/default/secrets/master.key';
    const DATABASE_URL = process.env.DATABASE_URL;
    const INTERVAL_MS = Number(process.env.ROTATE_INTERVAL_SEC || 1800) * 1000;

    // pg lives in the app's pnpm store, not as a hoisted dep — glob-require it.
    const pgBase = '/app/node_modules/.pnpm';
    const pgDir = fs.readdirSync(pgBase).filter(d => /^pg@[0-9]/.test(d)).sort().pop();
    const { Client } = require(pgBase + '/' + pgDir + '/node_modules/pg');

    function b64url(buf) {
      return Buffer.from(buf).toString('base64').replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }
    function loadMasterKey() {
      const raw = fs.readFileSync(MASTER_KEY_FILE, 'utf8').trim();
      if (/^[A-Fa-f0-9]{64}$/.test(raw)) return Buffer.from(raw, 'hex');
      const d = Buffer.from(raw, 'base64'); if (d.length === 32) return d;
      if (Buffer.byteLength(raw, 'utf8') === 32) return Buffer.from(raw, 'utf8');
      throw new Error('master key is not 32 bytes (hex/base64/raw)');
    }
    function encrypt(masterKey, value) {
      const iv = crypto.randomBytes(12);
      const c = crypto.createCipheriv('aes-256-gcm', masterKey, iv);
      const ct = Buffer.concat([c.update(value, 'utf8'), c.final()]);
      return { scheme: 'local_encrypted_v1', iv: iv.toString('base64'),
               tag: c.getAuthTag().toString('base64'), ciphertext: ct.toString('base64') };
    }
    function decrypt(masterKey, m) {
      const d = crypto.createDecipheriv('aes-256-gcm', masterKey, Buffer.from(m.iv, 'base64'));
      d.setAuthTag(Buffer.from(m.tag, 'base64'));
      return Buffer.concat([d.update(Buffer.from(m.ciphertext, 'base64')), d.final()]).toString('utf8');
    }
    function appJwt() {
      const now = Math.floor(Date.now() / 1000);
      const head = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
      const body = b64url(JSON.stringify({ iat: now - 60, exp: now + 540, iss: APP_ID }));
      const s = crypto.createSign('RSA-SHA256'); s.update(head + '.' + body);
      return head + '.' + body + '.' + b64url(s.sign(PRIVATE_KEY));
    }
    async function gh(url, opts) {
      opts = opts || {};
      const r = await fetch(url, { method: opts.method || 'GET', body: opts.body, headers: {
        Accept: 'application/vnd.github+json', 'User-Agent': 'paperclip-gh-app-rotator',
        'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) } });
      if (!r.ok) throw new Error(url + ' -> ' + r.status + ' ' + (await r.text()).slice(0, 300));
      return r.json();
    }
    async function secretId(client) {
      const { rows } = await client.query(
        "SELECT id FROM company_secrets WHERE company_id=$1 AND key=$2 AND coalesce(status,'')<>'deleted' LIMIT 1",
        [COMPANY_ID, SECRET_KEY]);
      if (!rows.length) throw new Error('secret ' + SECRET_KEY + ' not found for company ' + COMPANY_ID);
      return rows[0].id;
    }
    async function selfTest() {
      const client = new Client({ connectionString: DATABASE_URL }); await client.connect();
      try {
        const sid = await secretId(client);
        const { rows } = await client.query(
          "SELECT material FROM company_secret_versions WHERE secret_id=$1 AND status='current' ORDER BY version DESC LIMIT 1", [sid]);
        if (!rows.length) throw new Error('no current version to self-test');
        const val = decrypt(loadMasterKey(), rows[0].material);
        if (!val || val.length < 8) throw new Error('self-test decrypt produced an implausible value');
        console.log('[gh-app-rotator] self-test OK (master key decrypts current secret, len ' + val.length + ')');
      } finally { await client.end(); }
    }
    async function installationId(jwt) {
      if (INSTALLATION_ID) return INSTALLATION_ID;
      const list = await gh('https://api.github.com/app/installations', { headers: { Authorization: 'Bearer ' + jwt } });
      if (!Array.isArray(list) || !list.length) throw new Error('app has no installations');
      if (list.length > 1) console.error('[gh-app-rotator] multiple installations; using the first (set GITHUB_APP_INSTALLATION_ID to pin one)');
      return String(list[0].id);
    }
    async function rotateOnce() {
      const jwt = appJwt();
      const instId = await installationId(jwt);
      // Installation-wide token (no `repositories` filter) so ONE token covers
      // EVERY repo the app is installed on — one rotator for all current and
      // future repos; adding a repo means only installing the app on it. But we
      // request an explicit permission SUBSET (contents + pull_requests only, the
      // Release Engineer's job) rather than the app's full set: the app also holds
      // workflows:write, which is the Tech-Lead-only, board-gated privilege — the
      // RE must never carry it. GitHub lets an installation token narrow (never
      // widen) the app's permissions, so this is a hard downscope.
      const tok = await gh('https://api.github.com/app/installations/' + instId + '/access_tokens', {
        method: 'POST', headers: { Authorization: 'Bearer ' + jwt, 'Content-Type': 'application/json' },
        body: JSON.stringify({ permissions: { contents: 'write', pull_requests: 'write', metadata: 'read' } }) });
      const token = tok.token;
      const material = encrypt(loadMasterKey(), token);
      const sha = crypto.createHash('sha256').update(token).digest('hex');
      const client = new Client({ connectionString: DATABASE_URL }); await client.connect();
      try {
        const sid = await secretId(client);
        await client.query('BEGIN');
        const { rows } = await client.query('SELECT latest_version FROM company_secrets WHERE id=$1 FOR UPDATE', [sid]);
        const next = (rows[0].latest_version || 0) + 1;
        await client.query(
          "INSERT INTO company_secret_versions (id, secret_id, version, material, value_sha256, fingerprint_sha256, status, created_by_user_id, created_at) " +
          "VALUES (gen_random_uuid(), $1, $2, $3::jsonb, $4, $4, 'disabled', 'github-app-rotator', now())", [sid, next, JSON.stringify(material), sha]);
        await client.query('UPDATE company_secrets SET latest_version=$2, last_rotated_at=now(), updated_at=now() WHERE id=$1', [sid, next]);
        await client.query("UPDATE company_secret_versions SET status='previous' WHERE secret_id=$1 AND version<>$2", [sid, next]);
        await client.query("UPDATE company_secret_versions SET status='current' WHERE secret_id=$1 AND version=$2", [sid, next]);
        await client.query('COMMIT');
        console.log('[gh-app-rotator] rotated ' + SECRET_KEY + ' -> v' + next + ' (installation ' + instId + ', all-repo token, expires ' + tok.expires_at + ')');
      } catch (e) { await client.query('ROLLBACK').catch(() => {}); throw e; }
      finally { await client.end(); }
    }
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    async function idleForever(why) { console.error('[gh-app-rotator] idling: ' + why); for (;;) await sleep(600000); }
    // This container shares the Paperclip pod; if it EXITS the pod goes NotReady
    // and drops out of the Service. So it NEVER exits — every failure mode idles
    // (and never writes a bad secret version) instead of crashing.
    (async () => {
      if (!APP_ID || !PRIVATE_KEY || APP_ID.includes('REPLACE') || PRIVATE_KEY.includes('REPLACE')) {
        return idleForever('GITHUB_APP_ID / GITHUB_APP_PRIVATE_KEY not set — fill paperclip-github-app secret and restart the pod');
      }
      // Retry the self-test until it passes; NEVER rotate (or exit) until the
      // master key provably decrypts the current secret.
      for (;;) {
        try { await selfTest(); break; }
        catch (e) { console.error('[gh-app-rotator] self-test failed — will NOT rotate:', e.message); await sleep(60000); }
      }
      for (;;) {
        try { await rotateOnce(); } catch (e) { console.error('[gh-app-rotator] rotate error:', e.message); }
        await sleep(INTERVAL_MS);
      }
    })().catch(e => { idleForever('unexpected: ' + (e && e.message)); });
