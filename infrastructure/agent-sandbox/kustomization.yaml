apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Vendored from kubernetes-sigs/agent-sandbox v0.5.6 (the newest release that
  # still SERVES the v1alpha1 Sandbox API — v1.0.0+ dropped it, but Paperclip's
  # k8s plugin still emits agents.x-k8s.io/v1alpha1). Installs the CRD + the
  # agent-sandbox-controller into the agent-sandbox-system namespace. Needed by
  # Paperclip's sandbox-cr backend (multi-command exec, which the job backend
  # can't do). Controller image: registry.k8s.io/agent-sandbox/...:v0.5.6.
  - sandbox.yaml
