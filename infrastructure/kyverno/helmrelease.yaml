apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    app.kubernetes.io/part-of: gitops
spec:
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: "3.9.1"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Minimal footprint. We only need admission-time mutation of new agent Job
    # pods, so the admission controller is the only component we run — the
    # background, reports and cleanup controllers are disabled (they'd add
    # several hundred MB for policy reporting/GC we don't use). This keeps
    # Kyverno light on an already memory-conscious cluster.
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    admissionController:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
