apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./infrastructure/authentik"
  prune: true
  wait: true
  timeout: 15m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cert-manager-config
    - name: longhorn
    - name: postgres
    - name: shared-redis
  # OCI runs its own, independent Authentik instance (own outpost, own empty
  # CNPG DB, same service names as OVH but a different cluster — no cross-cluster
  # reference). Hostname rewritten to the oci. subdomain; OIDC redirect-URI
  # registration for oci. hostnames is a later phase.
  patches:
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: authentik
          namespace: authentik
        spec:
          values:
            global:
              host: https://auth.oci.dcxxiv.com
            server:
              ingress:
                enabled: true
                ingressClassName: traefik
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                  - auth.oci.dcxxiv.com
                tls:
                  - secretName: authentik-tls
                    hosts:
                      - auth.oci.dcxxiv.com
                  - secretName: authentik-outpost-tls
                    hosts:
                      - auth.oci.dcxxiv.com
      target:
        kind: HelmRelease
        name: authentik
        namespace: authentik
