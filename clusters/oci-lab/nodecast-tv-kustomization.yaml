apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nodecast-tv
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/nodecast-tv
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cert-manager-config
    - name: longhorn
  patches:
    - patch: |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: nodecast-tv
          namespace: nodecast-tv
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: nodecast-tv-compress@kubernetescrd
        spec:
          rules:
            - host: tv.oci.dcxxiv.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: nodecast-tv
                        port:
                          number: 3000
          tls:
            - hosts:
                - tv.oci.dcxxiv.com
              secretName: nodecast-tv-tls
      target:
        kind: Ingress
        name: nodecast-tv
        namespace: nodecast-tv
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nodecast-tv
          namespace: nodecast-tv
        spec:
          replicas: 0
      target:
        kind: Deployment
        name: nodecast-tv
        namespace: nodecast-tv
