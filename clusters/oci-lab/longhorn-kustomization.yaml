apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/storage/longhorn
  prune: true
  wait: true
  timeout: 15m
  # No backupTarget patch here (unlike clusters/ovh-lab/longhorn-kustomization.yaml):
  # OCI's Longhorn volumes are empty in Phase 1 and must not touch OVH's live S3
  # backup target. Restore-time wiring is a later phase.
  dependsOn:
    - name: cert-manager-config
