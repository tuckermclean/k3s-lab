apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dcxxiv-home
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/dcxxiv-home
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: cert-manager-config
  patches:
    - patch: |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: dcxxiv-home
          namespace: dcxxiv-home
        spec:
          rules:
            - host: oci.dcxxiv.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: dcxxiv-home
                        port:
                          number: 80
            - host: www.oci.dcxxiv.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: dcxxiv-home
                        port:
                          number: 80
          tls:
            - hosts:
                - oci.dcxxiv.com
                - www.oci.dcxxiv.com
              secretName: dcxxiv-home-tls
      target:
        kind: Ingress
        name: dcxxiv-home
        namespace: dcxxiv-home
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: dcxxiv-home
          namespace: dcxxiv-home
        spec:
          replicas: 0
      target:
        kind: Deployment
        name: dcxxiv-home
        namespace: dcxxiv-home
