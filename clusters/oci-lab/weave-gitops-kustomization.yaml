apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./infrastructure/weave-gitops"
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cert-manager-config
  patches:
    - patch: |
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: weave-gitops-tls
          namespace: weave-gitops
        spec:
          dnsNames:
            - flux.oci.dcxxiv.com
      target:
        kind: Certificate
        name: weave-gitops-tls
        namespace: weave-gitops
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: weave-gitops
          namespace: weave-gitops
        spec:
          values:
            ingress:
              hosts:
                - host: flux.oci.dcxxiv.com
                  paths:
                    - path: /
                      pathType: Prefix
              tls:
                - secretName: weave-gitops-tls
                  hosts:
                    - flux.oci.dcxxiv.com
      target:
        kind: HelmRelease
        name: weave-gitops
        namespace: weave-gitops
