apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wordpress
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/wordpress
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cert-manager-config
    - name: mariadb
  patches:
    - patch: |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: wordpress
          namespace: wordpress
        spec:
          rules:
            - host: lol.oci.dcxxiv.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: wordpress
                        port:
                          number: 80
          tls:
            - hosts:
                - lol.oci.dcxxiv.com
              secretName: wordpress-tls
      target:
        kind: Ingress
        name: wordpress
        namespace: wordpress
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: wordpress
          namespace: wordpress
        spec:
          replicas: 0
      target:
        kind: Deployment
        name: wordpress
        namespace: wordpress
