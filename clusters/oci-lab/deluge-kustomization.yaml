apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deluge
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/deluge
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    # letsencrypt-prod ClusterIssuer (DNS01/Cloudflare) for the TLS cert
    - name: cert-manager-config
    # longhorn StorageClass for the config PVC
    - name: longhorn
    # authentik/authentik forwardAuth Middleware referenced by the IngressRoute
    - name: authentik
  # No storage-juicefs dependency here (unlike clusters/ovh-lab/deluge-kustomization.yaml):
  # juicefs-kustomization.yaml is excluded from clusters/oci-lab/ entirely — the
  # shared media PVC simply doesn't mount on OCI.
  patches:
    - patch: |
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: deluge-cert
          namespace: media
        spec:
          dnsNames:
            - deluge.oci.dcxxiv.com
      target:
        kind: Certificate
        name: deluge-cert
        namespace: media
    - patch: |
        apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: deluge
          namespace: media
        spec:
          entryPoints:
            - websecure
          routes:
            - kind: Rule
              match: Host(`deluge.oci.dcxxiv.com`)
              middlewares:
                - name: authentik
                  namespace: authentik
              services:
                - name: deluge
                  port: 8112
          tls:
            secretName: deluge-tls
      target:
        kind: IngressRoute
        name: deluge
        namespace: media
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: deluge
          namespace: media
        spec:
          replicas: 0
      target:
        kind: Deployment
        name: deluge
        namespace: media
