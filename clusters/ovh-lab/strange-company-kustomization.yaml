apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: strange-company
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/strange-company
  prune: true
  wait: true
  # Hermes' first image pull is slow (~900MB/38 layers).
  timeout: 20m
  # ─────────────────────────────────────────────────────────────────────────
  # SINGLE SOURCE OF TRUTH for the control-plane image tag. Bump ONLY this line.
  # ${SC_CONTROL_PLANE_VERSION} is substituted into controlPlane.image.tag in
  # apps/strange-company/helmrelease.yaml. The build tags the image :main and
  # :sha-<short> (no semver), so use the immutable sha-<short> tag.
  # ─────────────────────────────────────────────────────────────────────────
  postBuild:
    substitute:
      SC_CONTROL_PLANE_VERSION: "sha-bd7292e"
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    # letsencrypt-prod ClusterIssuer for the kanban/hermes TLS certs
    - name: cert-manager-config
    # Longhorn StorageClass for the Hermes + Vikunja PVCs
    - name: longhorn
    # CloudNativePG role + strange-company/vikunja databases must exist first
    - name: postgres
